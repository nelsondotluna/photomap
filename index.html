<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Display a map on a webpage</title>
<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.js"></script>
<style>
#map {
    width: 100%;
    max-width: 1200px; /* Increased from 900px to 1200px for larger desktop display */
    aspect-ratio: 16/9; /* Wider aspect ratio for desktop */
    min-height: 400px;  /* Increased min-height for desktop */
    border-radius: 12px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.15);
    margin: 0 auto;
    display: block;
}
.map-container {
    width: 100%;
    min-height: 400px;
    display: flex;
    justify-content: center;
    align-items: center;
    box-sizing: border-box;
    padding: 2vw 0;
}
@media (max-width: 1200px) {
    #map {
        max-width: 98vw;
        aspect-ratio: 1/1;
        min-height: 200px;
        height: auto;
    }
}
@media (max-width: 600px) {
    #map {
        max-width: 98vw;
        aspect-ratio: 1/1;
        min-height: 200px;
        height: auto;
    }
    .mapboxgl-popup-content img {
        max-width: 90vw;
        max-height: 40vw;
    }
}
.mapboxgl-popup-content img {
    max-width: 350px;
    max-height: 250px;
    width: 100%;
    height: auto;
    display: block;
    margin-bottom: 8px;
}
.lightbox-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85);
    z-index: 9999;
    justify-content: center;
    align-items: center;
}
.lightbox-overlay.active {
    display: flex;
}
.lightbox-img {
    max-width: 90vw;
    max-height: 90vh;
    border-radius: 8px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.3);
}
.lightbox-close {
    position: absolute;
    top: 24px;
    right: 36px;
    color: #fff;
    font-size: 2.5rem;
    font-weight: bold;
    cursor: pointer;
    z-index: 10000;
    text-shadow: 0 2px 8px #000;
}
</style>
<div class="map-container">
    <div id="map"></div>
</div>
<!-- Lightbox overlay -->
<div id="lightbox-overlay" style="display:none;position:fixed;z-index:9999;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.85);justify-content:center;align-items:center;flex-direction:column;">
    <span id="lightbox-close" style="position:absolute;top:24px;right:36px;font-size:2.5rem;color:#fff;cursor:pointer;font-family:sans-serif;z-index:10001;">&times;</span>
    <img id="lightbox-img" src="" alt="Photo" style="max-width:90vw;max-height:80vh;border-radius:10px;box-shadow:0 2px 16px rgba(0,0,0,0.25);margin-bottom:18px;">
    <div id="lightbox-meta" style="color:#fff;font-size:1.1rem;text-align:center;"></div>
</div>
<script>
mapboxgl.accessToken = 'pk.eyJ1IjoibmVsc29uZG90bHVuYSIsImEiOiJjbWFsOGFzMGUwNmhkMnNwcmFsazh3amhwIn0.L0SXpHLZn3weIzCKYsy8Cw';
const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/nelsondotluna/cmalh1ocb002901s4788jemw2',
    center: [-73.950863, 40.714917],
    zoom: 11
});

map.on('load', () => {
    map.addSource('Photos', {
        type: 'vector',
        url: 'mapbox://nelsondotluna.cmao6jxbf3ilz1omfougz1hau-6p40o'
    });

    map.addLayer({
        'id': 'clickables',
        'type': 'circle',
        'source': 'Photos',
        'source-layer': 'Photolinks',
        'minzoom': 0,   // Show from world view
        'maxzoom': 24,  // Show to max zoom
        'paint': {
           'circle-radius': [
                'interpolate', ['linear'], ['zoom'],
                5, 3,   // At zoom 5, radius 3
                10, 5,  // At zoom 10, radius 5
                14, 10  // At zoom 14+, radius 10
            ],
            'circle-color': '#9ae515'
        }
    });

    map.addSource('Walks', {
        type: 'vector',
        url: 'mapbox://nelsondotluna.cmalgxewl11xv1qrxd5zzcfrd-4mcqp'
    });
    map.addLayer({
        'id': 'walks-line',
        'type': 'line',
        'source': 'Walks',
        'source-layer': 'WALK_MASTER-b0h2kk',
        'minzoom': 0,   // Show from world view
        'maxzoom': 24,  // Show to max zoom
        'paint': {
            'line-color': '#1a73e8',
            'line-width': [
                'interpolate', ['linear'], ['zoom'],
                5, 2,    // At zoom 5, width 2px
                10, 3,   // At zoom 10, width 3px
                14, 8    // At zoom 14+, width 8px
            ]
        }
    });
    map.addLayer({
        'id': 'walks-line-debug',
        'type': 'line',
        'source': 'Walks',
        'source-layer': 'WALK_MASTER-b0h2kk',
        'minzoom': 0,
        'maxzoom': 24,
        'paint': {
            'line-color': '#ff00ff',
            'line-width': 4,
            'line-opacity': 1
        }
    });

    map.on('click', 'clickables', (e) => {
        const feature = e.features[0];
        const url = feature.properties['flickr_url'];
        const img_url = feature.properties['img_url'];
        const date_taken = feature.properties['date_taken'];
        if (img_url) {
            // Show lightbox overlay
            document.getElementById('lightbox-img').src = img_url;
            let meta = '';
            if (date_taken) {
                meta += `<div><strong>Date Taken:</strong> ${date_taken}</div>`;
            }
            if (url) {
                meta += `<div style='margin-top:8px;'><a href="${url}" target="_blank" style="color:#9ae515;text-decoration:underline;">See on Flickr</a></div>`;
            }
            document.getElementById('lightbox-meta').innerHTML = meta;
            document.getElementById('lightbox-overlay').style.display = 'flex';
        }
    });
    map.on('mouseenter', 'clickables', () => {
        map.getCanvas().style.cursor = 'pointer';
    });
    map.on('mouseleave', 'clickables', () => {
        map.getCanvas().style.cursor = '';
    });
});
// Lightbox close logic
const overlay = document.getElementById('lightbox-overlay');
document.getElementById('lightbox-close').onclick = () => { overlay.style.display = 'none'; };
overlay.onclick = (e) => {
    if (e.target === overlay) overlay.style.display = 'none';
};
</script>

</body>
</html>
